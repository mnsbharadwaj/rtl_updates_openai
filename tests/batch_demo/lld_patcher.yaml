# lld_patcher.yaml -- Batch demo config
#
# Usage:
#   cd tests/batch_demo
#   python -m lld_gen.main_sfr run-config --config lld_patcher.yaml

sfr_old_dir: "./old_sfr"          # OLD SFR headers  (*.h)
sfr_new_dir: "./new_sfr"          # NEW SFR headers  (*.h, same filenames)
lld_dir:     "./lld"              # LLD headers to scan and patch
output_dir:  "./lld_patched"      # Patched copies written here
tests_dir:   "./tests_generated"  # Generated unit-test .c files

# -----------------------------------------------------------------------
# LLM -- cloud endpoint is used by DEFAULT
#
#   no_llm: false  (default) -> LLM ON  -> cloud endpoint auto-selected
#   no_llm: true             -> LLM OFF -> template-only, no HTTP calls
# -----------------------------------------------------------------------
no_llm: false

# -----------------------------------------------------------------------
# Git / compile -- disable for demo
# -----------------------------------------------------------------------
no_git:        true
compile_check: false
gcc:           null
